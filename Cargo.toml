[package]
name = "murmduck"
version = "0.1.0"
edition = "2024"
description = "Lightweight, on-demand streaming text-to-speech for Linux"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
